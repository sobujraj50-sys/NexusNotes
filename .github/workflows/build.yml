name: Build APK

# How it works:
# 1. Upload the project ZIP to the repository root with GitHub "Add file > Upload files".
# 2. This workflow unpacks it into the repository, deletes the ZIP, commits the source,
#    builds the APK and publishes it under Releases.
# You can also run it by hand: Actions > Build APK > Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Unpack uploaded project ZIP
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP in the repository root - building the repository as it is."
            exit 0
          fi
          if [ ${#zips[@]} -gt 1 ]; then
            echo "::error::More than one .zip in the repository root (${zips[*]}). Delete the extra ones and upload again."
            exit 1
          fi
          zip="${zips[0]}"
          echo "Unpacking $zip"
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          unzip -q "$zip" -d /tmp/unpack
          settings="$(find /tmp/unpack -maxdepth 2 -name settings.gradle.kts | head -n 1)"
          if [ -z "$settings" ]; then
            echo "::error::$zip does not contain settings.gradle.kts. Upload the full project ZIP."
            exit 1
          fi
          src="$(dirname "$settings")"
          git rm -q --cached "$zip" || true
          rm -f "$zip"
          # Mirror the project into the repo. .git and .github are never deleted.
          rsync -a --delete --filter='P .git/' --filter='P .github/' "$src"/ ./
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ZIP matched the repository; nothing to commit."
          else
            git commit -q -m "Unpack $zip [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$NEXUS_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus.jks"
            export NEXUS_KEYSTORE_PATH="$RUNNER_TEMP/nexus.jks"
            ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
            apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing. Building a DEBUG APK with a temporary key - it cannot update an app installed from an earlier build."
            ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
            apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          fi
          version="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')"
          out="NexusNotes-${version}-build${{ github.run_number }}.apk"
          cp "$apk" "$out"
          echo "APK_FILE=$out" >> "$GITHUB_ENV"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APK_VERSION}-build${{ github.run_number }}"
          gh release create "$tag" "$APK_FILE" \
            --target "$(git rev-parse HEAD)" \
            --title "Nexus Notes ${APK_VERSION} (build ${{ github.run_number }})" \
            --notes "Built automatically from commit $(git rev-parse --short HEAD). Download the APK below and install it on your phone."

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
